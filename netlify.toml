[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # La URL y la clave anon de Supabase son públicas por diseño (acaban en el JS del navegador);
  # la seguridad la pone RLS. Evita que el escáner de secretos de Netlify las marque.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_TURN_URL,VITE_TURN_USER,VITE_TURN_PASS"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permite compartir pantalla y usar la cámara/capturadora solo desde la propia app
    Permissions-Policy = "display-capture=(self), camera=(self), microphone=(), geolocation=()"

# SPA: todas las rutas sirven index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

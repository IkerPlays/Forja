name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run selftest && npm run bundle
        working-directory: desktop
  threeds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Librerías de la 3DS (curl, mbedTLS)
        run: |
          ls /opt/devkitpro/portlibs/3ds/lib 2>/dev/null | grep -E 'libcurl|libmbedtls' || dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib
          ls /opt/devkitpro/portlibs/3ds/lib | grep -E 'curl|mbed|libz'
      - run: make -C agent3ds

name: Build Forja Desktop

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run selftest
      - run: npm run dist
      - name: Publicar en la Release desktop-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Forja para escritorio (última versión)
          prerelease: true
          body: Instalador de Forja para escritorio. Windows = Forja-Setup-*.exe · Linux = Forja-*.AppImage
          files: |
            desktop/dist/Forja-Setup-*.exe
            desktop/dist/Forja-*.AppImage

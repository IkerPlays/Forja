name: Build Forja3DS

on:
  push:
    branches: [main]
    paths: ['agent3ds/**', '.github/workflows/build-3ds.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make -C agent3ds
      - uses: actions/upload-artifact@v4
        with:
          name: Forja3DS
          path: |
            agent3ds/Forja3DS.3dsx
            agent3ds/Forja3DS.smdh

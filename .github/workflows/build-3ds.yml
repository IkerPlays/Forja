name: Build Forja3DS

on:
  push:
    branches: [main]
    paths: ['agent3ds/**', '.github/workflows/build-3ds.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make -C agent3ds
      # Los artefactos de Actions tienen cuota; las Releases no.
      - name: Publicar Release (forja3ds-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forja3ds-latest
          name: Forja3DS (última versión)
          prerelease: true
          body: App homebrew para la 3DS. Copia Forja3DS.3dsx a /3ds/ en la SD.
          files: |
            agent3ds/Forja3DS.3dsx
            agent3ds/Forja3DS.smdh
